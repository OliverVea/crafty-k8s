# Crafty Controller 4.
#
# This chart deploys the PANEL only. It deliberately knows nothing about which
# Minecraft version, mod loader or modpack you run — those are created and managed
# from Crafty's web UI at runtime and live in the PVC, never in git. That is the
# whole point: the same chart serves a vanilla server, a modpack, or several at once.
image:
  repository: registry.gitlab.com/crafty-controller/crafty-4
  # Pinned deliberately. `latest` would mean a silent panel upgrade on every pod
  # restart, which is not a thing you want to discover mid-session.
  tag: "4.10.8"
  pullPolicy: IfNotPresent

timezone: Etc/UTC

persistence:
  enabled: true
  # local-path = node NVMe. Never point this at NFS or any network-backed volume:
  # Minecraft chunk saves are latency-sensitive and network storage produces
  # hitching that looks exactly like a mod bug.
  storageClass: local-path
  size: 100Gi
  # Existing claim to adopt instead of creating one. Empty = create.
  existingClaim: ""

service:
  # LoadBalancer works on k3s via the built-in servicelb (klipper), which binds
  # these ports directly on the node. That is what gets you a real 25565 on the
  # LAN — NodePort's 30000-32767 range cannot.
  type: LoadBalancer
  panelPort: 8443
  # Minecraft server ports. Crafty can host many servers; each needs its own port
  # published here. Add an entry when you add a server in the UI.
  serverPorts:
    - name: mc-primary
      port: 25565
    - name: mc-secondary
      port: 25566
  # Set to publish Bedrock (UDP) or Dynmap. Off by default.
  bedrock:
    enabled: false
    port: 19132
  dynmap:
    enabled: false
    port: 8123

# A real hostname for the panel, routed through Traefik with a Let's Encrypt cert,
# instead of https://<node-ip>:8443 and a browser warning.
#
# NOTE this covers the PANEL only. The Minecraft ports stay raw TCP on the LoadBalancer
# above: an HTTP ingress cannot carry the Minecraft protocol, so clients still connect
# to the host/IP on 25565.
ingress:
  enabled: false
  className: traefik
  host: crafty-private.ovea.pro
  tls:
    enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Points the DNS record at the Tailscale address, matching the other
    # *-private.ovea.pro services. This is not exposed to the public internet.
    external-dns.alpha.kubernetes.io/target: 100.100.117.17
    # Deliberately NOT behind the authentik forward-auth middleware that the other
    # private services use: Crafty has its own account system, and its websocket
    # console would be fighting an SSO redirect.

resources:
  requests:
    # CPU requests but NO CPU limit, on purpose: CFS quota throttling mid-tick is
    # the top cause of phantom TPS stutter on containerized Minecraft servers.
    cpu: "2"
    memory: 4Gi
  limits:
    # Memory limit must cover Crafty itself PLUS every server JVM it spawns as a
    # subprocess. JVM metaspace and direct buffers live outside -Xmx, so a limit set
    # equal to the heap gets the pod OOM-killed mid-session. Rule of thumb: sum of
    # all server heaps + ~2Gi.
    memory: 12Gi

# Crafty's image runs as a non-root user that relies on ROOT GROUP permissions on
# its /crafty mounts. fsGroup 0 is what makes the mounted PVC writable for it.
podSecurityContext:
  fsGroup: 0

nodeSelector: {}
tolerations: []
affinity: {}

# Optional maintenance job: regenerate a mods-manifest.txt (truncated sha256 + size of
# every *.jar) inside each server dir, so a fingerprint of the installed modpack rides
# along in every backup zip and disaster recovery knows exactly what was installed.
#
# OFF by default. The chart is otherwise mod-agnostic (see the note at the top of this
# file); this is the one opt-in feature that peeks at server contents. Crafty offers no
# native way to do this — its backup hooks are console-only — so it lives here. It only
# writes a manifest for servers that actually have mods and touches nothing else.
modsManifest:
  enabled: false
  # Daily at 04:00 (container TZ, default UTC). Mods change rarely, so daily is plenty.
  schedule: "0 4 * * *"
  # Needs only sha256sum, stat, date and a POSIX shell — busybox/alpine covers it.
  image: alpine:3.20
